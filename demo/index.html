<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapDashboard 독립 테스트</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow">객체지향프로그래밍 · 내 서울 공원 길라잡이</p>
    <h1>MapDashboard 독립 테스트</h1>
    <p>가상 공원 6개를 사용하는 테스트 화면입니다. 실제 공원 데이터와 최종 팀 UI는 포함하지 않습니다.</p>
    <p id="demo-status" role="status">Python 실행 환경을 준비하고 있습니다…</p>
  </header>
  <main>
    <section class="filters" aria-label="공원 필터">
      <label>지역 <select id="district"><option value="">전체 구</option></select></label>
      <label>최소 면적 (㎡) <input id="min-area" type="number" min="0" step="any" placeholder="제한 없음"></label>
      <label>최대 면적 (㎡) <input id="max-area" type="number" min="0" step="any" placeholder="제한 없음"></label>
      <p class="count" aria-live="polite">표시 중 <strong id="park-count">0</strong>개</p>
    </section>
    <div class="workspace">
      <section aria-label="공원 지도"><div id="map"></div></section>
      <section class="list-panel" aria-label="공원 목록">
        <h2>공원 목록</h2>
        <p class="hint">열 제목을 누르면 정렬, 행을 누르면 지도 이동 · 입력 후 Enter 또는 다른 칸 클릭으로 적용</p>
        <div class="table-scroll"><table id="park-list" aria-label="필터 결과 공원"></table></div>
        <p class="hint">좌표가 없는 공원도 목록과 개수에 포함되며 지도 마커만 생략됩니다.</p>
      </section>
    </div>
    <pre id="test-results" hidden aria-live="polite"></pre>
  </main>
  <script type="py" src="main.py" config="pyscript.json"></script>
</body>
</html>
